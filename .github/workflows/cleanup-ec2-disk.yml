name: EC2 Disk Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "=== Disk before cleanup ==="
          df -h /

          echo "=== Top disk consumers ==="
          sudo du -sh /* 2>/dev/null | sort -rh | head -20

          echo "=== Docker disk usage ==="
          docker system df -v

          echo "=== Stop container, prune all images, restart ==="
          docker stop chinese-backend || true
          docker system prune -af --volumes
          sudo apt-get clean
          sudo journalctl --vacuum-time=3d
          sudo find /tmp -type f -atime +7 -delete 2>/dev/null || true
          sudo find /var/log -name "*.gz" -delete 2>/dev/null || true
          sudo find /var/log -name "*.1" -delete 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /

          echo "=== Restarting backend (will re-pull image on next deploy) ==="
          echo "NOTE: backend is stopped - trigger a deploy to restart it"
