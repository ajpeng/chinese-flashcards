name: Run Backend Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run inside the chinese-backend container"
        required: true
        type: choice
        options:
          - "seed:hsk:prod          — seed HSK vocabulary (skips existing rows)"
          - "seed:examples:prod     — seed example sentences from Tatoeba dataset (skips if already loaded)"
          - "dedup:hsk:prod         — remove duplicate HSK words, keeping lowest level"
          - "migrate                — run pending Prisma migrations (prisma migrate deploy)"
          - "health-check           — curl the /health endpoint and show container logs"

jobs:
  run-command:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and run command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # command_timeout must be generous for the seed scripts (up to 5 min)
          command_timeout: 10m
          script: |
            CHOICE="${{ github.event.inputs.command }}"

            echo "▶ Selected: $CHOICE"
            echo ""

            case "$CHOICE" in

              seed:hsk:prod*)
                echo "🌱 Seeding HSK vocabulary..."
                docker exec chinese-backend npm run seed:hsk:prod
                ;;

              seed:examples:prod*)
                echo "📖 Seeding example sentences..."
                docker exec chinese-backend npm run seed:examples:prod
                ;;

              dedup:hsk:prod*)
                echo "🔁 Deduplicating HSK words..."
                docker exec chinese-backend npm run dedup:hsk:prod
                ;;

              migrate*)
                echo "🗄️ Running Prisma migrations..."
                docker exec chinese-backend ./node_modules/.bin/prisma migrate deploy
                ;;

              health-check*)
                echo "🏥 Health check..."
                curl -sf http://localhost:3001/health | python3 -m json.tool || echo "Health endpoint not reachable"
                echo ""
                echo "📋 Last 50 container log lines:"
                docker logs --tail 50 chinese-backend
                ;;

              *)
                echo "❌ Unknown command: $CHOICE"
                exit 1
                ;;
            esac

            echo ""
            echo "✅ Done."
