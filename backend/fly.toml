app = 'ajpeng-chinese-backend'
primary_region = 'iad'

[build]

[env]
  PORT = "3001"
  NODE_ENV = "production"

[deploy]
  release_command = "node_modules/.bin/prisma migrate deploy"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
